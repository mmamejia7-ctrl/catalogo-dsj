<style>
/* ===================================================================
   CONFIGURACIÓN DE PRECIOS — ver también PRECIOS_URL en el script
   =================================================================== */
:root{--neg:#0f3d5e;--rojo:#1a6fa8;--rojo2:#1592e6;--crema:#f5f6f8;--crema2:#eceef2;--tx:#555;--card:#fff;--fs:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html,body{overflow-x:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--neg);font-size:calc(16px*var(--fs));
 background:linear-gradient(160deg,var(--crema),var(--crema2)) fixed;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:radial-gradient(circle at 105% 25%,rgba(21,146,230,.07) 0 230px,transparent 231px),radial-gradient(circle at -8% 80%,rgba(21,146,230,.06) 0 200px,transparent 201px),radial-gradient(circle at 88% 95%,rgba(0,0,0,.035) 0 150px,transparent 151px)}
header{position:sticky;top:0;z-index:20;background:var(--neg);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;max-width:1100px;margin:auto}
.ttl b,.ttl small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top img{width:46px;height:46px;border-radius:10px;background:#f6f5f1;object-fit:contain;padding:3px}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:1.05em;letter-spacing:.3px}.ttl small{color:#bbb;font-size:.78em}
.btn{border:0;border-radius:999px;padding:9px 13px;font-weight:700;font-size:.85em;cursor:pointer;background:#333;color:#fff}
.btn.on{background:var(--rojo2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px;max-width:1100px;margin:auto}
#q{flex:1 1 100%;min-width:0;border:0;border-radius:12px;padding:12px 14px;font-size:1em;outline:none}
.seg{display:flex;flex:1 1 100%;background:#333;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:#ccc;font-weight:700;padding:8px 11px;border-radius:9px;font-size:.85em}
.seg button.on{background:var(--rojo2);color:#fff}
.redline{height:5px;background:var(--rojo)}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;max-width:1100px;margin:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--neg);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85em;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid var(--rojo)}
main{max-width:1100px;margin:auto;padding:0 14px 120px}
.info{font-size:.8em;color:var(--tx);padding:2px 2px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.info .dot{width:8px;height:8px;border-radius:50%;background:#2e9d4a;display:inline-block}
.info.off .dot{background:#d08a00}
h2{font-size:1.3em;margin:22px 2px 2px;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:6px;height:1.1em;background:var(--rojo);border-radius:3px}
.marca{color:var(--tx);font-size:.82em;margin:0 2px 10px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(150px*var(--fs))),1fr));gap:12px}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.card:active{transform:scale(.97)}
.card .im{aspect-ratio:1/1;background:#f7f7f7;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:contain}
.card .b{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .n{font-weight:700;font-size:.92em;line-height:1.2}
.card .d{font-size:.75em;color:var(--tx)}
.precio{margin-top:auto;padding-top:6px;font-weight:800;color:var(--rojo);font-size:1.15em}
.precio.no{color:#999;font-weight:600;font-size:.8em}
.vacio{text-align:center;color:var(--tx);padding:50px 10px}
/* modal */
#m{position:fixed;inset:0;background:#0c3350;z-index:50;display:none;flex-direction:column;color:#fff}
#m.on{display:flex}

#m .x{background:var(--rojo2);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:1.05em;font-weight:800}
#m .nav2{background:#333;color:#fff;border:0;border-radius:999px;width:48px;height:48px;font-size:1.4em}
#m .mi{flex:1;display:flex;align-items:center;justify-content:center;padding:0 10px;min-height:0;overflow:auto}
#m .mi img{max-width:100%;max-height:100%;border-radius:12px;background:#fff;touch-action:pinch-zoom}
#m .mb{padding:16px 18px calc(22px + env(safe-area-inset-bottom));text-align:center;background:var(--neg);border-top:5px solid var(--rojo)}
#m .mn{font-size:1.6em;font-weight:800;line-height:1.2}
#m .md{font-size:1.1em;color:#ccc;margin-top:6px}
#m .mp{font-size:2.2em;font-weight:900;color:#ffd35c;margin-top:8px}
#m .mp small{display:block;font-size:.42em;color:#bbb;font-weight:600}
#m .mc{font-size:.8em;color:#888;margin-top:6px}
.big{--fs:1.3}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--neg);color:#fff;padding:10px 16px;border-radius:999px;font-size:.85em;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.card .im{position:relative}
.tag{position:absolute;right:5px;bottom:5px;background:var(--rojo2);color:#fff;font-weight:900;font-size:1.02em;padding:5px 9px 5px 10px;border-radius:10px 4px 10px 4px;box-shadow:0 3px 8px rgba(0,0,0,.3);border:2px solid #fff;line-height:1}
.tag small{display:block;font-size:.55em;font-weight:700;opacity:.85;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.tag.no{background:#777;font-size:.75em;font-weight:700}
#m .mi{position:relative}
#m .wrap{position:relative;display:inline-block;max-width:100%;max-height:100%}#m .wrap img{display:block;max-height:calc(100vh - 330px)}#m .mi .tag{font-size:1.7em;right:10px;bottom:10px}
.sh{margin-top:12px;background:#25d366;color:#fff;border:0;border-radius:999px;padding:13px 22px;font-size:1.05em;font-weight:800}

.add{padding:0 11px 12px}
.add button{font:inherit;cursor:pointer}
.agr{width:100%;border:0;border-radius:10px;padding:10px;background:var(--neg);color:#fff;font-weight:800;font-size:.9em}
.stp{display:flex;align-items:center;justify-content:space-between;background:#eef6fd;border:2px solid var(--rojo2);border-radius:10px;overflow:hidden}
.stp button{border:0;background:var(--rojo2);color:#fff;width:44px;height:40px;font-size:1.4em;font-weight:900}
.stp span{font-weight:900;font-size:1.15em;color:var(--rojo)}
.card.sel{outline:3px solid var(--rojo2)}
#cbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:none;max-width:700px;margin:auto;
 background:#25d366;color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 6px 20px rgba(0,0,0,.3);align-items:center;gap:10px;cursor:pointer;border:0;font:inherit;width:calc(100% - 24px)}
#cbar.on{display:flex}#cbar .ct{flex:1;text-align:left;line-height:1.25}#cbar b{font-size:1.05em}#cbar small{display:block;opacity:.9;font-size:.82em}
#cbar .go{background:#fff;color:#128c3e;border-radius:999px;padding:9px 14px;font-weight:900;font-size:.9em}
#ped{position:fixed;inset:0;z-index:55;background:var(--crema);display:none;flex-direction:column}
#ped.on{display:flex}
#ped .ph{background:var(--neg);color:#fff;padding:14px;display:flex;align-items:center;gap:10px;border-bottom:5px solid var(--rojo)}
#ped .ph b{flex:1;font-size:1.2em}
#ped .pb{flex:1;overflow:auto;padding:14px;max-width:700px;width:100%;margin:auto}
.li{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.li img{width:64px;height:64px;object-fit:contain;background:#f7f7f7;border-radius:8px;flex:none}
.li .lt{flex:1;min-width:0}.li .lt b{display:block;font-size:.92em;line-height:1.2}.li .lt small{color:var(--tx);font-size:.8em}
.li .stp{flex:none;width:118px}.li .stp button{width:36px;height:36px;font-size:1.2em}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:1.25em;padding:12px 4px;border-top:2px dashed #ccc;margin-top:6px}
.fld{display:block;margin:10px 0}.fld span{display:block;font-weight:700;font-size:.85em;margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid #ccc;border-radius:10px;padding:12px;font:inherit;background:#fff}
.vend{background:#fff;border-radius:12px;padding:12px;border-left:5px solid #25d366;margin:6px 0 4px;font-size:.95em}
#ped .pf{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.wa{display:block;width:100%;max-width:700px;margin:auto;border:0;border-radius:14px;background:#25d366;color:#fff;font-weight:900;font-size:1.15em;padding:16px}
.lnk{background:none;border:0;color:var(--rojo);font-weight:700;text-decoration:underline;font:inherit;cursor:pointer;padding:6px 0}
#madd{margin-top:12px;max-width:260px;margin-left:auto;margin-right:auto}
#madd .agr{background:var(--rojo2);font-size:1.05em;padding:13px}
#madd .stp{background:#1d5580}#madd .stp span{color:#fff}

.tiers{font-size:.72em;color:var(--tx);margin-top:3px;line-height:1.35}
.tiers b{color:var(--rojo)}
.grp{display:inline-block;background:#e8f1fb;color:#1d5fa8;border-radius:6px;padding:1px 6px;font-size:.92em;font-weight:700;margin-top:2px}
.esc{width:100%;max-width:340px;margin:10px auto 0;border-collapse:collapse;font-size:1.02em}
.esc td{padding:5px 8px;border-bottom:1px solid #333;text-align:left}.esc td:last-child{text-align:right;font-weight:800;color:#ffd35c}
.esc tr.act td{background:#1d5580}
.li .lt small b{color:var(--rojo)}
.nivel{display:inline-block;background:var(--rojo2);color:#fff;border-radius:6px;padding:0 5px;font-size:.9em;font-weight:800}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.prt{display:flex;gap:8px;margin-top:8px}.prt button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;background:#0f3d5e;color:#fff;font-size:.95em}
.modo{background:#f2c94c;color:#0f3d5e;font-weight:800;font-size:.75em;text-align:center;padding:4px}
.cbox{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cbox h3{margin:0 0 6px;font-size:1em}
.sug{max-height:220px;overflow:auto;border:1px solid #ddd;border-radius:10px;margin-top:6px;background:#fff;display:none}
.sug div{padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}.sug div:active{background:#fdecec}
.sug small{color:var(--tx)}
.pend{background:#fff4d6;border-radius:10px;padding:8px 12px;font-size:.85em;margin-bottom:8px;display:none}
.card[data-c^="BOLSA"] .tag{top:5px;bottom:auto}
.fzl{display:flex;justify-content:space-between;align-items:center;background:#e8f1fb;color:#1d5fa8;border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:700;font-size:1.05em}.fzl b{font-size:1.25em;font-weight:900}
.stp span{cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px;flex:1;text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center}

/* Dejar libre la esquina de abajo donde Netlify pone su cartel */
#cbar{bottom:calc(78px + env(safe-area-inset-bottom))!important}
#ped .pf{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}
main{padding-bottom:190px!important}
.tag.sp{background:#1f7a4d}
.modo.esp{background:#1f7a4d;color:#fff}

.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 16px;padding:16px 18px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#0f3d5e 0%,#1d5580 45%,#1a6fa8 100%);box-shadow:0 6px 18px rgba(21,146,230,.25)}
.hero small{display:block;font-size:.72em;letter-spacing:1.2px;text-transform:uppercase;color:#f2c94c;font-weight:800}
.hero b{display:block;font-size:1.25em;line-height:1.2;margin:2px 0}.hero span{font-size:.82em;color:#ddd}
.vertodo{flex:none;border:0;background:#fff;color:#1a6fa8;border-radius:999px;padding:10px 16px;font:800 .92em system-ui,Arial;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.cat{border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;font:inherit;text-align:left;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.08);transition:transform .12s, box-shadow .12s}
.cat:active{transform:scale(.97)}
.cimg{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:color-mix(in srgb,var(--cc) 7%,#fff)}
.cimg img{width:86%;height:86%;object-fit:contain}
.cimg i{position:absolute;top:8px;right:8px;background:var(--cc);color:#fff;font-style:normal;font-weight:900;font-size:.8em;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 7px}
.cn{display:block;flex:1;color:var(--neg);font-weight:700;font-size:.95em;line-height:1.2;padding:10px 12px 11px;border-top:3px solid var(--cc)}
.cn small{display:block;font-weight:500;font-size:.78em;color:#8a8f98;margin-top:3px}
.volver{border:0;background:#fff;border-radius:999px;padding:10px 16px;font:700 .95em system-ui,Arial;color:var(--neg);box-shadow:0 1px 4px rgba(0,0,0,.1);margin:8px 0 0;cursor:pointer}
nav a.on{background:var(--rojo2);color:#fff;border-left-color:var(--neg)}
.card.ago .im img{filter:grayscale(1);opacity:.45}.card.ago .n,.card.ago .d,.card.ago .tiers{opacity:.55}
.tag.ag{background:#5c5f66;font-size:.9em;letter-spacing:.5px}
.agr.off{background:#d5d7db!important;color:#6b6f76!important;cursor:not-allowed}
.lchip{display:inline-block;background:#1f7a4d;color:#fff;border-radius:6px;padding:1px 7px;font-size:.78em;font-weight:800;margin-left:4px}
.laviso.normal{background:#f1f3f5;color:#333;border-left-color:#868e96}
.laviso{background:#e6f4ec;color:#14532d;border-left:5px solid #1f7a4d;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9em;line-height:1.4}
.clibar[hidden]{display:none!important}
.clibar{max-width:1100px;margin:10px auto 0;padding:0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clibar>span{flex:1;min-width:0;background:#e6f4ec;color:#14532d;border:2px solid #1f7a4d;border-radius:12px;padding:10px 12px;font-size:.92em}
.clibar button{border:0;border-radius:12px;padding:11px 14px;font:800 .9em system-ui,Arial;cursor:pointer;background:#0f3d5e;color:#fff}
.clibar #cliQuitar{background:#eee;color:#0f3d5e}
.clibar .cliBig{flex:1;background:#1f7a4d;padding:14px;font-size:1em}
.ov .cpick{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e4dbd0;border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;color:#0f3d5e}

.wa2[hidden],.prt[hidden]{display:none!important}

.ov .mbtn{display:block;width:100%;text-align:left;background:#0f3d5e;color:#fff;border-radius:14px;padding:16px;font:800 1.05em system-ui,Arial}.ov .mbtn small{display:block;font-weight:500;font-size:.8em;color:#ccc;margin-top:3px}
.solb{background:#fff7e8;border:1px solid #f0c27a;border-radius:10px;padding:10px 12px;margin:4px 0 10px;font-size:14px}.solb label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.solb input{width:20px;height:20px;flex:none;margin-top:1px}.solb small{display:block;color:#7a5200;margin-top:6px;line-height:1.4}

/* ===== Lista limpia (foto a la izquierda, precio grande, botón ancho) ===== */
.grid{grid-template-columns:1fr;gap:0;background:#fff;border:1px solid #e9e9ec;border-radius:16px;overflow:hidden}

.grid .card:active{transform:none;background:#fafafa}

body{background:#fff!important}body:before{display:none}

.volver{background:#fff;border:1px solid #dcdce0;box-shadow:none}

<script>
const PRODUCTOS = window.PRODUCTOS;
const PX = Object.fromEntries(PRODUCTOS.map(p => [p.c, p]));
const QS = new URLSearchParams(location.search);
// ---------- CLIENTE ESPECIAL (enlace privado con sus precios) ----------
if (QS.get('c')) { if (LS.get('esp', null) !== QS.get('c')) ['espTel', 'espInfo', 'yo', 'carrito'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); LS.set('esp', QS.get('c')); LS.set('modo', { modo: 'cliente' }); }
const ESP = LS.get('esp', null);
const PKEY = ESP ? 'precios_esp' : 'precios';

// ---------- MODO: cliente (por defecto), vendedor u oficina ----------
if (QS.get('modo')) { LS.set('modo', { modo: QS.get('modo'), k: QS.get('k') || '', vend: QS.get('n') || '' }); }
const MODO = ESP ? { modo: 'cliente' } : LS.get('modo', { modo: 'cliente' });
const STAFF = MODO.modo == 'vendedor' || MODO.modo == 'oficina';
if (MODO.modo == 'vendedor' && !ESP && window.top === window && !/\bcat=1\b/.test(location.search)) { location.replace('panel.html'); }
let vend = null;                                     // vendedor que recibe el pedido
if (QS.get('v')) { vend = { telefono: QS.get('v'), nombre: QS.get('n') || 'su vendedor' }; LS.set('vend', vend); } else vend = LS.get('vend', null);
if (MODO.modo == 'vendedor') vend = { nombre: MODO.vend, telefono: (vend && vend.telefono) || '' };
if (MODO.modo == 'oficina' && !LS.get('vendOf', null)) vend = null; else if (MODO.modo == 'oficina') vend = LS.get('vendOf', null);
if (QS.get('t')) LS.set('tlock', QS.get('t'));
const EI = ESP ? (LS.get('espInfo', null) || {}) : {};
const SINP = !!(ESP && EI.sinprecio);   // cliente sin precios: los ve solo su vendedor
if (SINP) document.documentElement.classList.add('sinp');
// Identificador de este celular (para amarrar el enlace del cliente)
const DEV = (() => { let d = LS.get('dsjDev', ''); if (!d || String(d).length < 10) { d = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); LS.set('dsjDev', d); } return d; })();
if (ESP) vend = { nombre: EI.vendedor || 'Distribuidora San Jorge', telefono: LS.get('espWA', '') };
const tLock = ESP ? (EI.tipo == 'ambas' ? null : EI.tipo || 'mayoreo') : STAFF ? null : LS.get('tlock', null);

let tipo = tLock || LS.get('tipo', 'mayoreo'), precios = {}, vendedores = LS.get('vendedores', []), clientes = LS.get('clientes', []), visibles = [], idx = 0;
let carrito = LS.get('carrito', {}); for (const c in carrito) if (!PX[c]) delete carrito[c];
if (tLock) document.querySelector('.seg').style.display = 'none';
if (ESP) { $('#modoBar').style.display = 'block'; $('#modoBar').classList.add('esp'); $('#modoBar').textContent = (EI.autorizado ? 'PRECIOS ESPECIALES' : 'SU CATÁLOGO') + (EI.negocio || EI.nombre ? ' · ' + (EI.negocio || EI.nombre) : ''); }
if (STAFF) { $('#modoBar').style.display = 'block'; $('#modoBar').textContent = MODO.modo == 'oficina' ? 'MODO OFICINA' : 'MODO VENDEDOR · ' + MODO.vend; $('#cliBuscar').style.display = 'block'; $('#enviar').textContent = 'Guardar pedido'; }
$('#enviar').dataset.fotos = '1';

// Si el producto tiene "grupo" (ej. PAÑALES), el nivel de precio se calcula con la suma de todo el grupo
function grupoDe(c) { const x = precios[String(c).toUpperCase()]; return x && x.g ? x.g : ''; }
function equivDe(c) { const x = precios[String(c).toUpperCase()]; return x && x.e ? x.e : 1; }
function cantGrupo(c) { const g = grupoDe(c); if (!g) return carrito[c] || 0; let s = 0; for (const k in carrito) if (grupoDe(k) == g) s += carrito[k] * equivDe(k); return Math.round(s * 100) / 100; }
function unidadDe(c) { const x = precios[String(c).toUpperCase()]; return x && x.u ? x.u : 'fardos'; }
const nFardos = (n, c) => fardoTxt(n, unidadDe(c));
const pr = (p, q) => precioUnit(precios[p.c.toUpperCase()], tipo, q || cantGrupo(p.c) || 1);
const agot = c => !!(precios[String(c).toUpperCase()] || {}).a;
function tagH(p) {
  if (agot(p.c)) return '<div class="tag ag">AGOTADO</div>';
  const x = precioUnit(precios[p.c.toUpperCase()], tipo, 1);
  const uu = uVenta(p.c, tipo), sp = (precios[p.c.toUpperCase()] || {}).s; return x.precio ? `<div class="tag${sp ? ' sp' : ''}"><small>${sp ? (typeof LISTA_ACT !== 'undefined' && LISTA_ACT ? '★ ' + LISTA_ACT.nombre : 'su precio') : tipo}${uu ? ' · ' + uu : ''}</small>${fmt(x.precio)}</div>` : '<div class="tag no">Consulte precio</div>';
}
function tiersH(p) {
  if (tipo != 'mayoreo') return '';
  const e = escalones(precios[p.c.toUpperCase()]); if (e.length < 2) return '';
  const g = grupoDe(p.c);
  const ue = g ? unidadDe(p.c) : plural(uVenta(p.c, 'mayoreo'), 2); return '<div class="tiers">' + e.slice(1).map(x => `${x.desde}+ ${ue} <b>${fmt(x.precio)}</b>`).join(' · ') + (g ? `<br><span class="grp">Por volumen: suma todo ${g.toLowerCase()}${equivDe(p.c) != 1 ? ' (' + Math.round(1 / equivDe(p.c)) + ' paq. = 1 ' + unidadSing(unidadDe(p.c)) + ')' : ''}</span>` : '') + '</div>';
}
// Precio grande estilo tienda: L 175.00 con centavos arriba
function precioH(p) {
  if (agot(p.c)) return '<div class="pzl ag">Agotado</div><div class="pz no"><b>Sin stock por ahora</b></div>';
  const x = precioUnit(precios[p.c.toUpperCase()], tipo, 1), uu = uVenta(p.c, tipo), sp = (precios[p.c.toUpperCase()] || {}).s;
  if (!x.precio) return SINP ? '<div class="pzl">Precio</div><div class="pz no"><b>Lo confirma su vendedor</b></div>' : '<div class="pz no"><b>Consulte precio</b></div>';
  const [e, c] = Number(x.precio).toFixed(2).split('.');
  return `<div class="pzl${sp ? ' sp' : ''}">${sp ? (typeof LISTA_ACT !== 'undefined' && LISTA_ACT ? '★ ' + LISTA_ACT.nombre : '★ Su precio') : tipo == 'detalle' ? 'Detalle' : 'Mayoreo'}</div><div class="pz"><span class="lp">L</span><b>${Number(e).toLocaleString('en-US')}</b><sup>.${c}</sup>${uu ? `<small>por ${unidadSing(uu)}</small>` : ''}</div>`;
}
function addH(c) { if (agot(c)) return '<button class="agr off" disabled>Sin stock por ahora</button>'; const q = carrito[c] || 0; return q ? `<div class="stp"><button data-a="-" aria-label="Quitar uno">−</button><span data-a="q">${q}</span><button data-a="+" aria-label="Agregar uno">+</button></div>` : '<button class="agr" data-a="pick">+ Agregar</button>'; }

// ---------- PRECIOS ----------
async function cargar(manual) {
  try {
    let rows, vs = null;
    if (API) { const j = await apiGet(ESP ? { a: 'datos', c: ESP, tel: LS.get('espTel', '') || '', dev: DEV, t: Date.now() } : { a: 'datos', t: Date.now() }); rows = j.precios; vs = ESP ? null : j.vendedores;
      if (ESP && j.especial) { const ant = JSON.stringify([EI.tipo, EI.autorizado, EI.sinprecio || 0]); LS.set('espInfo', j.especial); LS.set('espWA', j.whatsapp || ''); vend = { nombre: j.especial.vendedor || 'Distribuidora San Jorge', telefono: j.whatsapp || '' }; $('#modoBar').textContent = (j.especial.autorizado || j.especial.tipo === undefined ? 'PRECIOS ESPECIALES · ' : 'SU CATÁLOGO · ') + (j.especial.negocio || j.especial.nombre);
        if (j.especial.tipo !== undefined && JSON.stringify([j.especial.tipo, j.especial.autorizado, j.especial.sinprecio || 0]) !== ant) { LS.set(PKEY, null); location.reload(); return; } } }
    else { const r = await fetch('precios.csv?t=' + Date.now(), { cache: 'no-store' }); rows = csvAObjs(await r.text()); }
    precios = mapaPrecios(rows); window._PRECIOS = precios; if (typeof LISTA_ACT !== 'undefined' && LISTA_ACT) { PRE_GEN = precios; precios = LISTA_ACT.p; window._PRECIOS = precios; } if (vs) { vendedores = vs; LS.set('vendedores', vs); }
    const ts = Date.now(); LS.set(PKEY, { p: precios, ts });
    $('#info').classList.remove('off'); $('#infot').textContent = 'Precios actualizados · ' + fechaHora(ts);
    if (manual) toast('Precios actualizados ✓');
  } catch (e) {

    x.fillStyle = '#fff'; x.font = '700 34px system-ui,Arial'; x.fillText('PRECIO ' + tipo.toUpperCase(), bx + 35, by + 52); x.font = '900 92px system-ui,Arial'; x.fillText(tx, bx + 35, by + 145); }
  x.fillStyle = '#0f3d5e'; x.fillRect(0, W, W, band); x.fillStyle = '#1a6fa8'; x.fillRect(0, W, W, 12);
  x.fillStyle = '#fff'; let fs = 64; x.font = `800 ${fs}px system-ui,Arial`; while (x.measureText(p.n).width > W - 80 && fs > 36) { fs -= 2; x.font = `800 ${fs}px system-ui,Arial`; }
  x.fillText(p.n, 40, W + 105); x.fillStyle = '#ccc'; x.font = '500 40px system-ui,Arial'; x.fillText(p.d, 40, W + 170);
  const e = tipo == 'mayoreo' ? escalones(precios[p.c.toUpperCase()]).slice(1) : [];
  x.fillStyle = '#ffd35c'; x.font = '700 34px system-ui,Arial'; x.fillText(e.length ? e.map(z => z.desde + '+ ' + fmt(z.precio)).join('   ') : 'Distribuidora San Jorge', 40, W + 250);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', .9));
}
if (!STAFF) $('#share').style.display = 'none';   // al cliente no le sale "Enviar foto con precio"
$('#share').onclick = async () => { const p = visibles[idx]; try { const b = await fotoConPrecio(p); const f = new File([b], p.i + '.jpg', { type: 'image/jpeg' });
  await compartirImagen(b, p.i + '.jpg', p.n); } catch (e) { if (e.name != 'AbortError') toast('No se pudo crear la foto'); } };

// ---------- CONTROLES ----------
$('#q').addEventListener('input', () => { if (!$('#q').value.trim() && seccion === null) window.scrollTo(0, 0); pintar(); });
document.querySelectorAll('.seg button').forEach(b => { b.classList.toggle('on', b.dataset.t == tipo); b.onclick = () => { tipo = b.dataset.t; LS.set('tipo', tipo); document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x == b)); pintar(); }; });
function setBig(v) { document.documentElement.classList.toggle('big', v); $('#aa').classList.toggle('on', v); LS.set('big', v); }
setBig(LS.get('big', false)); $('#aa').onclick = () => setBig(!document.documentElement.classList.contains('big'));

// ---------- Menú del vendedor: todo desde un solo enlace ----------
function menuStaff() {
  const tel = telWA((vend && vend.telefono) || LS.get('vend', {}).telefono || '');
  const base = new URL('./', location.href);
  const lnk = t => { const u = new URL(base); if (tel) u.searchParams.set('v', tel); if (MODO.vend) u.searchParams.set('n', MODO.vend); u.searchParams.set('t', t); return u.toString(); };
  const msg = t => `Hola, le saluda ${MODO.vend || 'Distribuidora San Jorge'}. Este es el catálogo de Distribuidora San Jorge con precios. Desde aquí puede hacer su pedido y me llega directo:\n\n${lnk(t)}\n\nGuárdelo en su celular: en Chrome toque ⋮ → Instalar y crear acceso directo.`;
  const wa = t => 'https://wa.me/?text=' + encodeURIComponent(msg(t));
  const { o, cerrar } = abrirOv(MODO.modo == 'oficina' ? 'Menú · Oficina' : 'Menú · ' + MODO.vend, `
    <button class="mbtn" id="mPed">📋 ${MODO.modo == 'oficina' ? 'Pedidos, recarga y clientes' : 'Mis pedidos y recarga'}<small>Ver, imprimir y sumar la carga del camión</small></button>
    ${MODO.modo == 'vendedor' ? `<h3 style="margin:16px 0 6px"><svg class="avion" viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.18em;margin-right:.3em"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>Mandar el catálogo a un cliente</h3><p class="nota" style="margin:0 0 8px">Se abre WhatsApp: escoja el chat del cliente. Los pedidos que haga le llegan a usted.</p>
    <a class="btn wa" href="${wa('mayoreo')}" target="_blank" rel="noopener" style="margin-bottom:8px">Catálogo de mayoreo</a>
    <a class="btn ng" href="${wa('detalle')}" target="_blank" rel="noopener">Catálogo de detalle</a>` : ''}`, '');
  o.querySelector('#mPed').onclick = () => { LS.set('ses', { k: MODO.k, vend: MODO.modo == 'vendedor' ? MODO.vend : '', rol: MODO.modo, nombre: MODO.modo == 'vendedor' ? MODO.vend : 'Oficina' }); location.href = 'pedidos.html'; };
}
if (STAFF) { $('#mnu').hidden = false; $('#mnu').onclick = menuStaff; }
$('#rf').onclick = () => cargar(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
const c0 = LS.get(PKEY, null); if (c0) { precios = c0.p; window._PRECIOS = precios; } pintar(); verPend(); barraCliente(); cargar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
